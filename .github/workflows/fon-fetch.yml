name: TEFAS Fon Verisi Çek

on:
  workflow_dispatch:  # Sadece manuel tetikleme (otomatik devre dışı)

jobs:
  fetch-funds:
    runs-on: ubuntu-latest
    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları yükle
        run: pip install requests

      - name: Fon verilerini çek ve API'ye gönder
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: python fetch_funds.py
