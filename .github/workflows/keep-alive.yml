name: Keep Finans API Alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health
        run: |
          curl -s -o /dev/null -w "Health: %{http_code}\n" \
            --max-time 60 \
            https://finans-api-ztnv.onrender.com/health

      - name: Warm up kripto cache
        run: |
          curl -s -o /dev/null -w "Kripto: %{http_code}\n" \
            --max-time 60 \
            -H "X-API-Key: ${{ secrets.FINANS_API_KEY }}" \
            "https://finans-api-ztnv.onrender.com/kripto/toplu?coinler=bitcoin,ethereum,solana,ripple"

      - name: Warm up altin cache
        run: |
          curl -s -o /dev/null -w "Altin: %{http_code}\n" \
            --max-time 60 \
            -H "X-API-Key: ${{ secrets.FINANS_API_KEY }}" \
            https://finans-api-ztnv.onrender.com/altin/tl
