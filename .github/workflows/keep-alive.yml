name: Keep Finans API Alive

on:
  schedule:
    - cron: '*/5 * * * *'   # Her 5 dakikada bir
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 60 \
            https://finans-api-ztnv.onrender.com/health)
          echo "Health: $response"

      - name: Warm up kripto cache
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 60 \
            -H "X-API-Key: myapp-8b91ec2472bf052240d3968eac17dc2d" \
            "https://finans-api-ztnv.onrender.com/kripto/toplu?coinler=bitcoin,ethereum,solana,ripple")
          echo "Kripto: $response"

      - name: Warm up altin cache
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 60 \
            -H "X-API-Key: myapp-8b91ec2472bf052240d3968eac17dc2d" \
            https://finans-api-ztnv.onrender.com/altin/tl)
          echo "Altin: $response"
